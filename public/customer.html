<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Customer Workflow · Portfolio Demo</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="site-header"><a class="brand" href="/">Workflow Assurance Demo</a><span class="pill">Customer</span></header>
  <main class="page-narrow">
    <section class="card">
      <span class="eyebrow">STEP 1 · VERIFY</span>
      <h1>주문 확인</h1>
      <p class="muted">샘플: <code>DEMO-2026-0001</code> / <code>김민준</code></p>
      <form id="verifyForm" class="form-grid">
        <label>주문번호<input name="orderNumber" value="DEMO-2026-0001" required></label>
        <label>주문자명<input name="customerName" value="김민준" required></label>
        <button class="button primary" type="submit">주문 확인</button>
      </form>
      <p id="verifyStatus" class="status"></p>
    </section>

    <section class="card hidden" id="intakeSection">
      <span class="eyebrow">STEP 2 · STRUCTURED INPUT</span>
      <h2>콘텐츠 입력</h2>
      <form id="intakeForm" class="form-grid">
        <label>받는 분<input name="recipient" value="엄마" required></label>
        <label>보내는 분<input name="sender" value="민준" required></label>
        <label>상황<select name="occasion"><option>감사, 추억</option><option>축하, 생일</option><option>프로포즈, 기념일, 사랑고백</option></select></label>
        <label class="full">사연<textarea name="story" rows="7" required>어릴 때는 늘 당연하다고 생각했던 순간들이 시간이 지나고 나서야 큰 사랑이었다는 것을 알게 되었습니다. 평범했던 하루와 함께 걷던 길까지 오래 기억하고 싶습니다.</textarea></label>
        <button class="button primary" type="submit">입력 제출</button>
      </form>
      <p id="intakeStatus" class="status"></p>
    </section>

    <section class="card hidden" id="generateSection">
      <span class="eyebrow">STEP 3 · MOCK GENERATION</span>
      <h2>초안 생성</h2>
      <p>외부 AI 호출 없이 local deterministic generator가 synthetic 초안을 생성합니다. 생성 결과는 고객에게 바로 공개되지 않고 관리자 검토 대기 상태가 됩니다.</p>
      <button id="generateButton" class="button primary">초안 생성</button>
      <p id="generateStatus" class="status"></p>
    </section>
  </main>
  <script type="module" src="/js/customer.js"></script>
</body>
</html>
