<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Control Center · Portfolio Demo</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="site-header"><a class="brand" href="/">Workflow Assurance Demo</a><span class="pill">Admin / Human Review</span></header>
  <main class="admin-layout">
    <aside class="card sidebar">
      <span class="eyebrow">DEMO LOGIN</span>
      <h2>관리자 인증</h2>
      <form id="loginForm" class="form-grid">
        <label>비밀번호<input name="password" type="password" value="portfolio-demo"></label>
        <button class="button primary">로그인</button>
      </form>
      <p id="loginStatus" class="status"></p>
      <hr>
      <span class="eyebrow">MANUAL ORDER CONTROL</span>
      <h3>수동 주문 등록</h3>
      <form id="manualForm" class="form-grid">
        <label>주문번호<input name="orderNumber" placeholder="OFFLINE-2026-001"></label>
        <label>주문자명<input name="customerName" placeholder="홍길동"></label>
        <button class="button">주문 생성</button>
      </form>
      <p id="manualStatus" class="status"></p>
    </aside>

    <section class="card admin-main">
      <div class="section-head"><div><span class="eyebrow">WORKFLOW MONITORING</span><h1>주문 / 통제 현황</h1></div><button class="button" id="refreshButton">새로고침</button></div>
      <div id="orders" class="orders"><p class="muted">관리자 로그인 후 표시됩니다.</p></div>
    </section>
  </main>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
